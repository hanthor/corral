name: Bump Homebrew formula

# Keeps the Homebrew formula in sync with tagged releases so `brew upgrade`
# always tracks the latest corral. Fires when a GitHub release is published
# (and on a raw tag push as a fallback); can also be run by hand to backfill.
#
# Requires a repo/org secret HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token)
# with contents:write on tuna-os/homebrew-tap. The default GITHUB_TOKEN cannot
# push to another repository. The job checks the secret is present before it
# reaches the tap, so a missing one says so instead of arriving as a 401.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish to the tap (e.g. v0.4.0)"
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    # Plugin channel tags (plugins-*) also match the tag trigger; only real
    # semver releases should touch the formula.
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref_name, 'v')
    steps:
      # Without this, an unset secret reaches the tap as an anonymous request
      # and comes back "401 Bad credentials", which reads like the token is
      # present but lacks access to tuna-os/homebrew-tap — sending whoever
      # debugs it to check permissions on a token that was never there. Every
      # run of this workflow so far (v0.5.0 twice, v0.6.0) failed that way.
      #
      # The check is inside `run` rather than in a step-level `if:` because the
      # secrets context is not available to `if` — the expression would be
      # silently empty and the guard would never fire.
      - name: Check HOMEBREW_TAP_TOKEN is set
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$COMMITTER_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set on this repository." \
                 "The formula bump needs a PAT with contents:write on" \
                 "tuna-os/homebrew-tap — the default GITHUB_TOKEN cannot push" \
                 "to another repository. Add the secret, then re-run this" \
                 "workflow by hand with the tag as input; no re-tagging needed."
            exit 1
          fi

      - name: Bump corral in tuna-os/homebrew-tap
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          # Named corral-vm in the tap to avoid clashing with homebrew/core's
          # unrelated "corral"; the installed binary is still `corral`.
          formula-name: corral-vm
          formula-path: Formula/corral-vm.rb
          homebrew-tap: tuna-os/homebrew-tap
          tag-name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          download-url: https://github.com/tuna-os/corral/archive/refs/tags/${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}.tar.gz
          commit-message: |
            corral {{version}}

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
