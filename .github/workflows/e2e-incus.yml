name: Multi-backend E2E Test

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pkg/incus/**"
      - "pkg/libvirt/**"
      - "cmd/incus.go"
      - ".github/workflows/e2e-incus.yml"
  workflow_dispatch:

jobs:
  e2e-incus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install & Configure Incus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq incus incus-client qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients virtinst \
            xorriso genisoimage ovmf swtpm swtpm-tools
          sudo incus admin init --minimal
          sudo usermod -aG incus-admin $USER
          sudo chmod 666 /var/lib/incus/unix.socket
          sudo systemctl start libvirtd
          sudo chmod 666 /run/libvirt/libvirt-sock

      - name: Build Corral
        run: |
          go build -o corral .
          ./corral context add incus-ci --backend incus --context local
          ./corral context add libvirt-ci --backend libvirt --context qemu:///system

      - name: Verify Built-in Incus Backend
        run: |
          ./corral incus --help

      - name: Run Incus LXC Container E2E Tests
        run: |
          ./corral incus create test-ct --image images:ubuntu/22.04
          # An LXC container is a CT, so it belongs in `ct list` — and it must
          # be absent from the VM fleet, which is where it used to appear as a
          # second copy of itself.
          ./corral ct list | grep test-ct
          ! ./corral list | grep -q test-ct
          ./corral incus start test-ct
          ./corral incus info test-ct
          ./corral incus stop test-ct
          ./corral incus delete test-ct

      - name: Run Incus VM E2E Tests
        run: |
          # Test Incus Virtual Machine launch
          ./corral incus create test-vm --image images:ubuntu/22.04 --vm --cpu 2 --mem 2Gi
          ./corral list | grep test-vm
          ./corral incus stop test-vm
          ./corral incus delete test-vm

      - name: Test Web UI Integration & Demo Seam
        run: |
          # Verify Web UI serves Incus aggregated endpoints in demo mode. The
          # demo remote holds one container and one virtual machine, and each
          # belongs to exactly one endpoint: the VM in /api/vms, the container
          # in /api/cts. Asserting both is what catches an instance being
          # listed twice.
          ./corral web --demo --addr 127.0.0.1:8006 &
          WEB_PID=$!
          trap 'kill $WEB_PID' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8006/api/vms -o /tmp/demo-vms.json && break
            sleep 1
          done
          jq -e 'any(.[]; .name == "incus-demo-vm" and .backend == "incus")' /tmp/demo-vms.json
          jq -e 'all(.[]; .name != "incus-demo-container")' /tmp/demo-vms.json
          curl -fsS http://127.0.0.1:8006/api/cts \
            | jq -e 'any(.[]; .name == "incus-demo-container" and .backend == "incus")'

      - name: Real triple-backend aggregate inventory (QEMU + Incus + libvirt)
        run: |
          qemu-img create -f qcow2 /tmp/corral-ci.qcow2 64M
          ./corral create qemu-ci --backend qemu --qcow /tmp/corral-ci.qcow2
          ./corral incus create incus-ci-vm --image images:ubuntu/22.04 --vm --cpu 1 --mem 1Gi
          sudo virsh -c qemu:///system define /dev/stdin <<'XML'
          <domain type='qemu'>
            <name>libvirt-ci</name><memory unit='MiB'>128</memory><vcpu>1</vcpu>
            <os><type arch='x86_64'>hvm</type></os>
          </domain>
          XML
          ./corral list | tee /tmp/fleet.txt
          grep -E '^qemu-ci[[:space:]]+qemu' /tmp/fleet.txt
          grep -E '^incus-ci-vm[[:space:]]+incus' /tmp/fleet.txt
          grep -E '^libvirt-ci[[:space:]]+libvirt' /tmp/fleet.txt

      # The backend adapters (#134 snapshot, #131 export, #129 device) against
      # the real tools. The fake-runner unit tests can only assert the command
      # syntax hasn't changed; this asserts it is correct — virsh, incus and
      # qemu-img each really do what the adapter believes.
      #
      # This matters most for the device adapters, whose syntax and output
      # shapes were written from documentation rather than observed on
      # hardware: discovery here parses what a real host's PCI bus produces,
      # and the generated <hostdev> XML is validated by a real libvirt.
      # Each subtest skips if its backend is missing, so a runner without one
      # degrades instead of failing.
      - name: Backend adapters against real backends
        run: |
          # pipefail, or `go test | tee` reports tee's exit status and a real
          # test failure lands as a green tick. Found exactly that way: an
          # Incus device-discovery failure passed this step unnoticed.
          set -o pipefail
          go test -count=1 -tags e2esnapshot -v -run TestE2E ./pkg/snapshot/ ./pkg/export/ ./pkg/device/ ./pkg/windows/ | tee /tmp/snap-e2e.txt
          # The subtests skip when their backend is missing, which keeps the
          # file runnable on a laptop — but this runner installs all three, so
          # a skip here means the test verified nothing and the green tick
          # would be lying. Fail on it.
          for backend in QEMU Libvirt Incus QEMUExport LibvirtExport IncusExport \
                         LibvirtDeviceDiscovery IncusDeviceDiscovery \
                         WindowsLibvirtDomainIsAccepted WindowsAnswerISO; do
            if grep -q "SKIP: TestE2E_${backend}\b" /tmp/snap-e2e.txt; then
              echo "::error::TestE2E_${backend} skipped on a runner that has that backend installed"
              exit 1
            fi
          done

      # The bootc targets, under their own build tag: this suite also contains a
      # privileged `bootc install to-disk` that pulls a multi-gigabyte image, so
      # only the import/create half runs here. The build half is verified on real
      # hardware (see pkg/bootc/e2e_test.go) rather than on every push.
      - name: Bootc targets against real backends
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" go test -count=1 -tags e2ebootc -timeout 10m -v \
            -run 'TestE2E_QEMUTargetAdopts|TestE2E_LibvirtTarget' ./pkg/bootc/ | tee /tmp/bootc-e2e.txt
          for name in QEMUTargetAdoptsTheBuiltDisk LibvirtTargetDomainIsAccepted; do
            if grep -q "SKIP: TestE2E_${name}\b" /tmp/bootc-e2e.txt; then
              echo "::error::TestE2E_${name} skipped on a runner that can run it"
              exit 1
            fi
          done

      - name: Multi-backend web inventory
        run: |
          ./corral web --addr 127.0.0.1:8007 &
          WEB_PID=$!
          trap 'kill $WEB_PID' EXIT
          for i in $(seq 1 20); do
            inventory=$(curl -fsS http://127.0.0.1:8007/api/v1/inventory) && break
            sleep 1
          done
          echo "$inventory" | jq -e 'any(.vms[]; .backend == "qemu")'
          echo "$inventory" | jq -e 'any(.vms[]; .backend == "incus")'
          echo "$inventory" | jq -e 'any(.vms[]; .backend == "libvirt")'
